# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: theroyakash
email: hey@iamroyakash.com
description: >- # this means to ignore newlines until "baseurl:"
  I am a Computer Scientist, researching Computer vision and other things too.
twitter_username: theroyakash
github_username: theroyakash
minimal_mistakes_skin: default
search: true

twitter:
  username: "theroyakash"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes


# Outputting
permalink: /:year/:month/:title/
paginate: 9 # amount of posts to show
paginate_path: /page:num/
timezone: Asia/Kolkata

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "theroyakash"
  avatar : "/images/bio-photo.jpg"
  bio    : "Computer Scientist"
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/theroyakash"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/theroyakash"

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/theroyakash"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/theroyakash"

defaults:
  # # _posts
  # - scope:
  #     path: ""
  #     type: posts
  #   values:
  #     layout: single
  #     author_profile: true
  #     read_time: true
  #     comments: true
  #     share: true
  #     related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: "images/"
    values:
      image: true


category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

comments:
  provider: "utterances"
  utterances:
    theme: "github-light" # "github-dark"
    issue_term: "pathname"
repository: "theroyakash/blog-comments"

social:
  type:  Person
  name:  theroyakash
  links:
    - "https://twitter.com/theroyakash"
    - "https://www.facebook.com/theroyakash"
    - "https://www.linkedin.com/in/theroyakash"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "UA-170952240-1"
    anonymize_ip: false